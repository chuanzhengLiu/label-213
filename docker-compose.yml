services:
  # MySQL数据库服务
  mysql:
    image: mysql:8.0.36
    container_name: scenic-manager-mysql
    platform: linux/amd64
    restart: always
    environment:
      # MySQL root密码
      MYSQL_ROOT_PASSWORD: root123456
      # 默认数据库
      MYSQL_DATABASE: scenic_manager
      # 时区设置
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      # 数据持久化
      - mysql_data:/var/lib/mysql
      # 初始化SQL脚本
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # MySQL配置文件（字符集设置）
      - ./sql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --init-connect='SET NAMES utf8mb4'
    networks:
      - scenic-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis缓存服务
  redis:
    image: redis:6-alpine
    container_name: scenic-manager-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      # Redis数据持久化
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - scenic-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 后端SpringBoot服务
  backend:
    build:
      context: ./scenic-manager-backend
      dockerfile: Dockerfile
    container_name: scenic-manager-backend
    restart: always
    ports:
      - "8088:8088"
    environment:
      # 数据库连接配置
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/scenic_manager?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123456
      # Redis连接配置
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      # 应用端口
      SERVER_PORT: 8088
      TZ: Asia/Shanghai
    volumes:
      # 应用日志
      - backend_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - scenic-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/doc.html || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 前端构建和Nginx服务
  frontend:
    build:
      context: ./scenic-manager-frontend
      dockerfile: Dockerfile
    container_name: scenic-manager-frontend
    restart: always
    ports:
      # Nginx暴露3000端口
      - "3000:3000"
    # 改为简单依赖，不等待健康检查
    depends_on:
      - backend
    networks:
      - scenic-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

# 数据卷定义
volumes:
  # MySQL数据卷
  mysql_data:
    driver: local
  # Redis数据卷
  redis_data:
    driver: local
  # 后端日志卷
  backend_logs:
    driver: local

# 网络定义
networks:
  scenic-network:
    driver: bridge
