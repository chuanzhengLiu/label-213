name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # 后端构建和测试
  backend:
    runs-on: ubuntu-latest
    name: Backend Build
    
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: root123456
          MYSQL_DATABASE: scenic_manager
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      
      redis:
        image: redis:6-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'corretto'
        cache: maven

    - name: Build with Maven
      working-directory: ./scenic-manager-backend
      run: mvn clean package -DskipTests

    - name: Test with Maven
      working-directory: ./scenic-manager-backend
      run: mvn test
      continue-on-error: true

  # 前端构建
  frontend:
    runs-on: ubuntu-latest
    name: Frontend Build

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./scenic-manager-frontend
      run: npm ci

    - name: Build
      working-directory: ./scenic-manager-frontend
      run: npm run build

  # Docker Compose 测试
  docker-compose:
    runs-on: ubuntu-latest
    name: Docker Compose Test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build backend Docker image
      working-directory: ./scenic-manager-backend
      run: |
        mvn clean package -DskipTests
        docker build -t scenic-manager-backend:test .

    - name: Build frontend Docker image
      working-directory: ./scenic-manager-frontend
      run: |
        npm ci
        npm run build
        docker build -t scenic-manager-frontend:test .

    - name: Test Docker Compose
      run: |
        docker-compose -f docker-compose.yml config
